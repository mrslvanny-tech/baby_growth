name: XiaoyaGrowth
options:
  bundleIdPrefix: com.xiaoyagrowth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  XiaoyaGrowthCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/XiaoyaGrowthCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.core
  XiaoyaGrowthApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: XiaoyaGrowthCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小芽成长
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryAddUsageDescription: 小芽成长需要添加纪念卡图片到系统相册。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/XiaoyaGrowthApp/XiaoyaGrowthApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  XiaoyaGrowthCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/XiaoyaGrowthCoreTests
    dependencies:
      - target: XiaoyaGrowthCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.core.tests
  XiaoyaGrowthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/XiaoyaGrowthUITests
    dependencies:
      - target: XiaoyaGrowthApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.ui.tests
        TEST_TARGET_NAME: XiaoyaGrowthApp
schemes:
  XiaoyaGrowth:
    build:
      targets:
        XiaoyaGrowthApp: all
        XiaoyaGrowthCoreTests: [test]
        XiaoyaGrowthUITests: [test]
    test:
      targets:
        - XiaoyaGrowthCoreTests
        - XiaoyaGrowthUITests
      gatherCoverageData: true

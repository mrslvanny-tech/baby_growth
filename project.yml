name: XiaoyaGrowth
options:
  bundleIdPrefix: com.xiaoyagrowth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  XiaoyaGrowthCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/XiaoyaGrowthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.core
  XiaoyaGrowthApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: XiaoyaGrowthCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 小芽成长
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryUsageDescription: 小芽成长需要访问照片，用于为成长记录和纪念卡选择本地图片。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  XiaoyaGrowthCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/XiaoyaGrowthCoreTests
    dependencies:
      - target: XiaoyaGrowthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoyagrowth.core.tests
schemes:
  XiaoyaGrowth:
    build:
      targets:
        XiaoyaGrowthApp: all
        XiaoyaGrowthCoreTests: [test]
    test:
      targets:
        - XiaoyaGrowthCoreTests
      gatherCoverageData: true
